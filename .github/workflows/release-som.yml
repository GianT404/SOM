name: Release SOM TUI

on:
  push:
    tags:
      - "tui-v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install ALSA dependencies (for Linux build)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config gcc-mingw-w64-x86-64

      - name: Build Linux amd64
        run: |
          GOOS=linux GOARCH=amd64 go build \
            -ldflags "-X main.Version=${{ github.ref_name }}" \
            -o som-linux-amd64 ./cmd/som

      - name: Build Windows amd64
        run: |
          CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc GOOS=windows GOARCH=amd64 go build \
            -ldflags "-X main.Version=${{ github.ref_name }}" \
            -o som-windows-amd64.exe ./cmd/som

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            som-linux-amd64
            som-windows-amd64.exe
          generate_release_notes: true

      - name: Delete tag on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh tag -d "$TAG" || true
          git push origin --delete "$TAG" || true
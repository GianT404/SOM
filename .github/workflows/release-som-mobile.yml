name: Release SOM Mobile APK

on:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install npm dependencies
        working-directory: app
        run: |
          npm install --legacy-peer-deps

      - name: Write .env from GitHub secret
        working-directory: app
        run: |
          echo "EXPO_PUBLIC_API_URL=${{ secrets.EXPO_PUBLIC_API_URL }}" > .env

      - name: Prebuild native project
        working-directory: app
        run: |
          npx expo prebuild -p android --no-install
      - name: Setup release signing keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"
            echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/keystore.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/release.keystore" \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass changeit -keypass changeit \
              -dname "CN=SOM, OU=Dev, O=SOM, L=HCM, ST=VN, C=VN" >/dev/null 2>&1
            echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=changeit" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=upload" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=changeit" >> "$GITHUB_ENV"
          fi

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: app/android
        run: |
          ./gradlew :app:assembleRelease --no-daemon

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

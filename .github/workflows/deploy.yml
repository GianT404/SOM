name: Deploy SOM Backend to GCP

on:
  push:
    branches:
      - main
    paths:
          - 'cmd/server/**'
          - 'internal/handler/**'
          - 'internal/scraper/**'
          - 'internal/cleaner/**'
          - 'internal/backend/**'
          - 'internal/playlist/**'
          - 'go.mod'
          - 'go.sum'
          - 'Dockerfile'
          - 'docker-compose.yml'
          - 'Caddyfile'
          - '.github/workflows/**'
          
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26' 
      - name: Install ALSA Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Run Unit Tests
        run: go test -v $(go list ./... | grep -v /tui)

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/som-backend:latest

  deploy:
      needs: build-and-push
      runs-on: ubuntu-latest
      steps:
        - name: SSH vào GCP VM và Kéo Image về chạy
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ secrets.GCP_VM_IP }}
            username: ${{ secrets.SSH_USERNAME }}
            key: ${{ secrets.SSH_PRIVATE_KEY }}
            script: |
              cd ~/SOM
              # Ép hạ toàn bộ container cũ và dọn dẹp rác mồ côi
              docker compose down --remove-orphans
              docker compose pull
              docker compose up -d
services:
  som-backend-prod:
    image: gian404/som-backend:latest
    container_name: som-backend-prod
    restart: always
    env_file:
      - .env
    environment:
      - TRUSTED_PROXIES=172.16.0.0/12
      - YTDLP_CACHE_DIR=/var/cache/som/yt-dlp
    volumes:
      - ytdlp_cache:/var/cache/som/yt-dlp
    mem_limit: 512m
    cpus: "1.8"
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # logging:
    #   driver: gcplogs
    #   options:
    #     gcp-project: "besom-502914"
    #     gcp-log-cmd: "true"

  caddy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  ytdlp_cache:
